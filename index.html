<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--soft:#F7EEF0;--ink:#1E1A1D;--muted:#76696F;--line:#ECE3E6;--accent:#7D2E4A;--on:#FFFFFF;--gold:#B8935A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141113;--surface:#1D181B;--soft:#271E23;--ink:#F4EEF0;--muted:#B3A6AC;--line:#33292E;--accent:#E7A6BC;--on:#141113;--gold:#D6B47E}}
:root[data-theme="dark"]{--bg:#141113;--surface:#1D181B;--soft:#271E23;--ink:#F4EEF0;--muted:#B3A6AC;--line:#33292E;--accent:#E7A6BC;--on:#141113;--gold:#D6B47E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:3px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 0}
header{display:flex;align-items:center;gap:12px;padding:14px 20px 6px;min-height:58px}
.ib{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib[hidden]{visibility:hidden;display:grid}
.bar{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.brand{flex:1;text-align:center;font:600 21px "Cormorant Garamond",Georgia,serif;letter-spacing:.02em}
#page{flex:1;padding:18px 24px 24px;display:flex;flex-direction:column}
.in-f{animation:inf .45s cubic-bezier(.2,.8,.2,1)}.in-b{animation:inb .45s cubic-bezier(.2,.8,.2,1)}
@keyframes inf{from{opacity:0;transform:translateX(28px)}}@keyframes inb{from{opacity:0;transform:translateX(-28px)}}
h1{font:600 38px/1.08 "Cormorant Garamond",Georgia,serif;margin:6px 0 12px;letter-spacing:-.01em}
h2{font:600 26px/1.15 "Cormorant Garamond",Georgia,serif;margin:28px 0 10px}
p{margin:0 0 14px}.sub{color:var(--muted)}
.step{color:var(--gold);font-size:14px;margin-bottom:2px}
footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 24px calc(18px + env(safe-area-inset-bottom,0px))}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;background:var(--accent);color:var(--on);font-weight:500;font-size:17px;cursor:pointer;text-align:center;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line);margin-top:10px}
.link{display:block;width:100%;border:0;background:none;color:var(--muted);padding:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .dot{border-color:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.opt .sw{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.opt small{display:block;color:var(--muted);font-size:14px}
.tile{display:block;text-decoration:none;color:inherit;width:100%;text-align:left;border:0;border-radius:24px;padding:22px;margin-bottom:12px;cursor:pointer;background:var(--soft);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile b{display:block;font:600 27px/1.1 "Cormorant Garamond",Georgia,serif;margin-bottom:4px}
.tile span{color:var(--muted);font-size:15px}
.tile.main{background:var(--accent);color:var(--on)}.tile.main span{color:inherit;opacity:.85}
.photo{position:relative;border-radius:24px;background:var(--soft);aspect-ratio:3/4;max-height:46vh;width:100%;margin:6px auto 16px;display:grid;place-items:center;overflow:hidden;color:var(--muted);text-align:center;padding:20px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo svg{width:84px;height:84px;fill:none;stroke:var(--gold);stroke-width:1.2}
.photo.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--gold);box-shadow:0 0 16px 3px var(--gold);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 2px)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb{display:block;text-align:center;border:1px solid var(--line);border-radius:999px;padding:14px 8px;cursor:pointer;font-weight:500;color:var(--accent)}
.lb.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.tips{list-style:none;padding:0;margin:8px 0 0}
.tips li{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px}.tips li:first-child{border-top:0}
.tips li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:10px;flex:none}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row span{display:block;color:var(--gold);font-size:14px;margin-bottom:2px}
.big{font:600 52px/1 "Cormorant Garamond",Georgia,serif;color:var(--accent);margin:4px 0 10px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 18px}
.pal div{aspect-ratio:1;border-radius:18px;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:500;animation:pop .5s backwards;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.rings{position:relative;width:44px;height:44px;flex:none}
.rings i{position:absolute;inset:0;border-radius:50%;border:1.2px solid var(--gold);opacity:.9}
.rings i:nth-child(2){inset:8px;opacity:.7}.rings i:nth-child(3){inset:16px;background:var(--gold);opacity:1}
.talk .rings i:nth-child(1){animation:ring 1.4s ease-out infinite}.talk .rings i:nth-child(2){animation:ring 1.4s .35s ease-out infinite}
@keyframes ring{to{transform:scale(1.5);opacity:0}}
#splash{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;transition:opacity .7s,transform .7s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .rings{width:150px;height:150px;margin-bottom:34px}
#splash .rings i:nth-child(2){inset:26px}#splash .rings i:nth-child(3){inset:54px}
#splash .rings i:nth-child(1){animation:ring 2.4s ease-out infinite}#splash .rings i:nth-child(2){animation:ring 2.4s .8s ease-out infinite}
#splash h1{font-size:54px;min-height:1.1em;margin:0 0 12px}
#splash p{max-width:330px;min-height:3.2em;color:var(--muted)}
#splash .btn{max-width:320px;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;pointer-events:none}
#splash .btn.show{opacity:1;transform:none;pointer-events:auto}
nav.dock{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--bg);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0}
nav.dock button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:13px;color:var(--muted);cursor:pointer}
nav.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav.dock button[aria-current="true"]{color:var(--accent)}
.card{border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:10px}
.card b{display:block;margin-bottom:8px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--accent);text-decoration:none;font-size:14px}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:16px Jost,sans-serif}
.chat{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.bub{max-width:86%;padding:12px 16px;border-radius:20px;white-space:pre-wrap}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:6px}
.bub.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.mic{width:88px;height:88px;border-radius:50%;border:0;background:var(--accent);color:var(--on);display:grid;place-items:center;margin:8px auto 6px;cursor:pointer}
.mic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.mic.on{animation:breath 1.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.08)}}
.note{background:var(--soft);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const REF=`BASE DE RÉFÉRENCE PROFESSIONNELLE (à suivre strictement, c’est la méthode de l’utilisatrice) :
COLORIMÉTRIE 12 SAISONS. Trois dimensions : température (chaude ou froide, sous-ton doré ou bleuté), valeur (claire ou profonde) et chroma (vive/claire ou douce/atténuée). Printemps (chaud, clair, lumineux) : Printemps Clair (Light Spring), Printemps Chaud/Pur (True/Warm Spring), Printemps Vif/Lumineux (Bright Spring). Été (froid, clair, doux) : Été Clair (Light Summer), Été Froid/Pur (True/Cool Summer), Été Doux/Atténué (Soft Summer). Automne (chaud, profond, doux) : Automne Doux (Soft Autumn), Automne Chaud/Pur (True/Warm Autumn), Automne Profond (Dark/Deep Autumn). Hiver (froid, profond, vif) : Hiver Vif/Lumineux (Bright Winter), Hiver Froid/Pur (True/Cool Winter), Hiver Profond (Dark/Deep Winter). Tableau : Bright Winter ou Bright Spring = éclat et fort contraste, tons saturés nets ; True Cool Winter ou Summer = froid pur, bleus, argent, pas d’or ; Dark Winter ou Autumn = profondeur et richesse, velours ; Soft Summer ou Autumn = douceur, tons poudrés et grisés ; True Warm Autumn ou Spring = chaud pur, or, terre, corail ; Light Summer ou Spring = clair, délicat, pastel. Test du blanc optique : seule la famille Hiver porte le noir intense et le blanc éclatant sans se fatiguer. Protocole de drapage : 1) or contre argent pour la température ; 2) couleur vive (fuchsia) contre atténuée (rose poussiéreux) pour le chroma ; 3) pièce test de la saison supposée. Règle d’or : les couleurs harmonieuses avec les traits du visage effacent les ombres et donnent un teint frais.
MORPHOLOGIE DU CORPS : Sablier (épaules et hanches égales, taille marquée), Rectangle (épaules, taille, hanches alignées), Triangle ou Poire (hanches plus larges que les épaules), Triangle inversé (épaules plus larges que les hanches), Rond ou Pomme (masse au centre, membres fins). Règle d’or : la morphologie dit où placer les ouvertures, les coupes et la taille ; le Kibbe dit la matière et le mouvement des tissus. Règle des professionnelles : on triche avec l’œil, on crée un point focal sur ses atouts, la silhouette (contour) doit convenir à la morphologie, la superposition rééquilibre les proportions. Questions utiles : où est-on la plus large, où grossit-on et maigrit-on en premier ; tenir compte de la taille, de l’ossature et de la génétique.
KIBBE (équilibre Yin = douceur, courbes, et Yang = force, angles, lignes) : Dramatic (très long, tranchant, droit ; tissus durs, épais, lignes géométriques), Soft Dramatic (long, tranchant, avec courbes ; velours, tissus fluides), Flamboyant Natural (grande carrure, os larges ; lignes libres, tissus lourds et naturels), Soft Natural (corps large et doux ; texture douce, coupes relâchées), Dramatic Classic (équilibré, épaules carrées nettes ; coupes Tailored structurées), Soft Classic (équilibré et doux, taille moyenne ; Fluide en bas, légère structure en haut), Pure Romantic (courbes totales, petit, sablier ; tissus très fluides, taille marquée), Theatrical Romantic (courbes avec angles vifs ; coupes féminines nettes), Soft Gamine (petit, os carrés, chair ronde ; lignes brisées, coupes vives). Test en 3 points : vérifier la fin des os des épaules (droits ou arrondis), la ligne verticale (long et élancé ou plus ramassé), l’interaction de la stature avec les os. Équilibre visuel : confort psychologique devant le miroir + gènes qui soutiennent la silhouette = allure idéale.
HARMONIE DES TENUES : une tenue a un point focal (une couleur vive ou un imprimé), tout le reste le soutient. Coordination par la couleur, les accessoires et le style. Mélange d’imprimés : garder les mêmes proportions. Palette neutre de 4 couleurs qui vont bien ensemble. Les bases : chemisiers, pantalons, jeans, vestes, robes, jupes, mailles, chaussures, sacs, accessoires. Penser aussi à l’âge et au mode de vie, à la qualité plutôt qu’à la quantité.
GARDE-ROBE CAPSULE (règle 5-4-3-2-1 = 15 pièces) : 5 hauts, 4 bas, 3 pièces d’extérieur ou couches (blazer, trench, cardigan), 2 paires de chaussures, 1 sac iconique. Équation : peu de pièces + qualité et tissus nobles + accord avec la morphologie et le Kibbe + couleurs cohérentes = looks sans fin. Test des 3 façons : avant d’acheter, la pièce doit pouvoir se porter de 3 façons différentes avec ce qu’on possède déjà, sinon elle n’a pas sa place. Looks types : travail élégant (blazer noir structuré, chemise blanche, pantalon droit), casual chic (cachemire gris, jean foncé, trench), soirée chic (haut fluide, jupe en crêpe fluide, talons, accessoire iconique). Désencombrer : classer en 3 (pièces qui vont à la morphologie et aux couleurs, pièces à retoucher, pièces à donner), limiter la palette neutre, photographier les looks réussis.`;

function seasonFromAnswers(a){
 let w=0,d=0,c=0;
 w+=a.veines==="vert"?1:a.veines==="bleu"?-1:0; w+=a.bijoux==="or"?1:a.bijoux==="argent"?-1:0;
 w+=a.soleil==="bronze"?1:a.soleil==="brule"?-1:0; w+=a.blanc==="casse"?1:a.blanc==="pur"?-1:0;
 if(a.cheveux==="roux")w+=1;
 d+={blond:-2,chatain:0,roux:0,brun:1,noir:2}[a.cheveux]||0; d+={bleu:-1,vert:0,marron:0,fonce:1}[a.yeux]||0;
 c+=a.vif==="vif"?1:a.vif==="doux"?-1:0; c+=a.noir==="oui"?1:a.noir==="non"?-1:0; c+=a.contraste==="fort"?1:a.contraste==="faible"?-1:0;
 const W=Math.abs(w)/4,D=Math.abs(d)/3,C=Math.abs(c)/3,warm=w>=0;
 if(D>=W&&D>=C)return d<0?(warm?"Printemps Clair":"Été Clair"):(warm?"Automne Profond":"Hiver Profond");
 if(C>=W)return c>0?(warm?"Printemps Vif":"Hiver Vif"):(warm?"Automne Doux":"Été Doux");
 return warm?(d<=0?"Printemps Chaud":"Automne Chaud"):(d<=0?"Été Froid":"Hiver Froid");
}

const PR_BODY=()=>REF+" Tu es styliste experte en morphologie et en Kibbe. Voici la photo en pied d’une cliente. Analyse ses proportions (épaules, taille, hanches, buste, jambes) et sa structure (anguleuse ou douce). Reste bienveillante, ne juge jamais le poids ni les formes. Morphologie parmi : Sablier, Poire, Pomme, Rectangle, Triangle inversé. Kibbe parmi : "+KIBBE_LIST+". Si la photo est inutilisable, réponds {\"erreur\":\"explication courte et ce qu’il faut changer\"}. "+FMT+"Format : {\"forme\":\"\",\"proportions\":\"1 phrase\",\"kibbe\":\"\",\"kibbe_pourquoi\":\"2 phrases\",\"conseils\":\"\",\"a_eviter\":\"\"}";
const PR_OUT=()=>REF+" Tu es styliste personnelle exigeante et bienveillante. Note la tenue de la photo de 0 à 10 : harmonie des couleurs, coupe, proportions, point focal, adéquation avec son profil ("+(PROFIL()||"inconnu")+"). Si la photo est inutilisable, réponds {\"erreur\":\"explication courte\"}. "+FMT+"Format : {\"note\":0,\"resume\":\"1 phrase\",\"points_forts\":[\"\"],\"changements\":[\"changement précis\"]}";
const ERRS={not_granted:"Autorise Claude à analyser tes photos, puis réessaie.",image_rejected:"Cette photo n’est pas acceptée. Essaie-en une autre.",rate_limited:"Trop de demandes. Réessaie dans un instant.",images_unavailable:"L’envoi de photos n’est pas disponible ici.",invalid_json:"La réponse n’a pas pu être lue. Réessaie."};
let SAMPLE=null;
async function getSample(){if(SAMPLE!==null)return SAMPLE;try{SAMPLE=window.claude?(await window.claude.use("sample"))||false:false}catch(e){SAMPLE=false}return SAMPLE}
function setMsg(t){S.runmsg=t;const m=$("#runmsg");if(m)m.textContent=t}
async function run(k){
 const sm=await getSample();S.busy=true;S.err="";
 if(k==="a_run"){
  if(!sm){S.res.couleurs={saison:seasonFromAnswers(S.ans),sous_ton:"",pourquoi:"D’après tes réponses au questionnaire."};S.res.visage={erreur:"L’analyse par photo n’est pas disponible ici."};S.res.corps={erreur:"L’analyse par photo n’est pas disponible ici."};save();S.busy=false;go("r_visage");return}
  say("Je regarde ton visage et tes couleurs, une seconde.");setMsg("Je regarde ton visage et tes couleurs.");
  try{
   const f=await sm.json(PR_FACE(),{images:[S.file.face]});
   if(f.erreur){S.res.visage=f;S.res.couleurs={saison:seasonFromAnswers(S.ans),sous_ton:"",pourquoi:"D’après tes réponses au questionnaire."}}
   else{S.res.visage=f.visage;S.res.couleurs=f.couleurs&&SEASONS[f.couleurs.saison]?f.couleurs:{saison:seasonFromAnswers(S.ans),sous_ton:f.couleurs?.sous_ton||"",pourquoi:f.couleurs?.pourquoi||""}}
   setMsg("Maintenant, ta silhouette.");say("Maintenant, je regarde ta silhouette.");
   S.res.corps=await sm.json(PR_BODY(),{images:[S.file.body]});
   save();S.busy=false;if(S.page==="a_run")go("r_visage");
  }catch(e){S.busy=false;S.err=ERRS[e&&e.code]||"L’analyse a échoué. Réessaie.";if(S.page==="a_run"){render(false);say(S.err)}}
 }else{
  if(!sm){S.err="L’analyse par photo n’est pas disponible ici.";S.busy=false;render(false);return}
  say("Je regarde ta tenue.");
  try{S.res.outfit=await sm.json(PR_OUT(),{images:[S.file.outfit]});save();S.busy=false;if(S.page==="o_run")go("o_res")}
  catch(e){S.busy=false;S.err=ERRS[e&&e.code]||"L’analyse a échoué. Réessaie.";if(S.page==="o_run"){render(false);say(S.err)}}
 }
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;S.micMsg="";
function SYS(){return REF+" Tu es la styliste personnelle de l’application Mon style. Parle comme une amie styliste chaleureuse, à l’oral : 2 à 4 phrases courtes, sans liste, sans emoji. Elle s’appelle "+(S.nom||"(prénom inconnu)")+" : appelle-la par son prénom et parfois « ma belle ». Commence ta toute première réponse par « Salut ma belle, ». Réponds en français, ou en arabe ou en anglais si elle écrit dans ces langues. Son profil : "+(PROFIL()||"pas encore analysé : invite-la à faire son analyse")+". Pour les achats, donne le type de pièce, la couleur et les mots-clés à chercher sur Zara, H&M, Mango, Shein, Namshi ou Ounass, sans inventer de lien ni de prix."}
async function send(text){
 text=(text||"").trim();if(!text||S.busy)return;const sm=await getSample();
 if(!sm){S.chat.push({r:"u",t:text},{r:"a",t:"La styliste n’est pas disponible sur cette page."});S.draft="";render(false);return}
 S.chat.push({r:"u",t:text},{r:"a",t:""});S.draft="";S.busy=true;render(false);unlock();
 const h=S.chat.slice(0,-1).map(c=>({role:c.r==="u"?"user":"assistant",content:c.t}));h[0]={role:"user",content:SYS()+"\n\n"+h[0].content};
 const id="#b"+(S.chat.length-1);
 try{const r=await sm(h,{cache:false,onText:({text})=>{const b=$(id);if(b)b.textContent=text}});S.chat[S.chat.length-1].t=r.text;say(r.text)}
 catch(e){S.chat[S.chat.length-1].t=e&&e.code==="rate_limited"?"Trop de messages, réessaie dans un instant.":e&&e.code==="not_granted"?"Autorise la styliste pour discuter avec elle.":"Une erreur est survenue. Réessaie."}
 S.busy=false;if(S.page==="chat")render(false);
}
function listen(){
 if(!SR||S.listen||S.busy)return;const r=new SR();r.lang="fr-FR";r.interimResults=false;
 unlock();S.listen=true;S.micMsg="";render(false);
 r.onresult=ev=>{S.listen=false;send(ev.results[0][0].transcript)};
 r.onerror=()=>{S.listen=false;S.micMsg="Le micro n’est pas disponible ici. Dicte avec le micro de ton clavier.";render(false)};
 r.onend=()=>{if(S.listen){S.listen=false;render(false)}};
 try{r.start()}catch(e){r.onerror()}
}

/*VOICE*/
function talk(on){document.body.classList.toggle("talk",on)}
let VOICES=[],KEEP=[];
function loadVoices(){try{VOICES=window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){}}
loadVoices();if(window.speechSynthesis)speechSynthesis.addEventListener?.("voiceschanged",loadVoices);
function speak(t){const ss=window.speechSynthesis;if(!ss||!t)return;
 const busy=ss.speaking||ss.pending;if(busy)ss.cancel();
 if(!VOICES.length)loadVoices();
 const lang=/[؀-ۿ]/.test(t)?"ar-SA":"fr-FR";const vs=VOICES.filter(x=>x.lang.toLowerCase().replace("_","-").startsWith(lang.slice(0,2)));
 const v=vs.find(x=>/amélie|audrey|marie|julie|hortense|denise|female|femme|google/i.test(x.name))||vs.find(x=>x.lang.replace("_","-")===lang)||vs[0];
 const parts=(t.match(/[^.!?…]+[.!?…]*/g)||[t]).map(x=>x.trim()).filter(Boolean);
 KEEP=parts.map((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=lang;if(v)u.voice=v;u.rate=1;u.volume=1;
  if(i===0)u.onstart=()=>talk(true);if(i===parts.length-1)u.onend=()=>talk(false);u.onerror=()=>talk(false);return u});
 const go=()=>{ss.resume();KEEP.forEach(u=>ss.speak(u))};
 if(busy)setTimeout(go,120);else go()}
function unlock(){const ss=window.speechSynthesis;if(!S.voice||!ss)return;try{ss.resume();const u=new SpeechSynthesisUtterance(".");u.volume=0.01;u.lang="fr-FR";ss.speak(u)}catch(e){}}
function stopVoice(){if(window.speechSynthesis)speechSynthesis.cancel();talk(false)}
/*ENDVOICE*/
function say(t){if(S.voice&&t)speak(t)}

document.addEventListener("click",e=>{
 const t=e.target.closest("button,[data-go]");if(!t)return;
 if(t.id==="back")return back();
 if(t.id==="voice"){S.voice=!S.voice;t.style.opacity=S.voice?1:.35;if(!S.voice)stopVoice();else{unlock();const p=P[S.page]();say(p.say||"Je suis là, "+NOM+".")}return}
 if(t.dataset.start==="A"){S.flow=FLOW_A;S.hist=["home"];S.page="a_nom";S.dir="f";S.res={outfit:S.res.outfit};render(true);return}
 if(t.dataset.go==="o_photo"){S.flow=FLOW_O;if(S.page!=="o_photo"){S.hist=["home"];S.page="o_photo";S.dir="f";render(true)}return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.view){S.flow=null;go(t.dataset.view);return}
 if(t.hasAttribute("data-next"))return next();
 if(t.hasAttribute("data-back"))return back();
 if(t.hasAttribute("data-home"))return home();
 if(t.hasAttribute("data-profil")){S.flow=null;S.hist=["home"];S.page="profil";S.dir="b";render(true);return}
 if(t.hasAttribute("data-nom")){const v=(S.nomDraft??S.nom??"").trim();if(!v)return;S.nom=v;NOM=v;S.nomDraft=undefined;save();return next()}
 if(t.hasAttribute("data-retry")){run(S.page);S.err="";render(false);return}
 if(t.dataset.ans){S.ans[t.dataset.ans]=t.dataset.v;render(false);setTimeout(()=>{if(S.page==="q_"+t.dataset.ans)next()},380);return}
 if(t.hasAttribute("data-shop")){S.shopQ=($("#shopq")||{}).value?.trim()||"";render(false);return}
 if(t.hasAttribute("data-mic"))return listen();
 if(t.hasAttribute("data-send"))return send(($("#msg")||{}).value);
});
document.addEventListener("click",e=>{if(e.target.closest("[data-call]"))stopVoice()});
document.addEventListener("change",e=>{const k=e.target.dataset.f,f=e.target.files&&e.target.files[0];if(!k||!f)return;
 if(S.url[k])URL.revokeObjectURL(S.url[k]);S.file[k]=f;S.url[k]=URL.createObjectURL(f);render(false);say("Très bien, ta photo est prête.")});
document.addEventListener("input",e=>{if(e.target.id==="msg")S.draft=e.target.value;if(e.target.id==="nom"){S.nomDraft=e.target.value;const b=document.querySelector("[data-nom]");if(b)b.disabled=!e.target.value.trim()}});
document.addEventListener("keydown",e=>{if(e.target.id==="msg"&&e.key==="Enter"){e.preventDefault();send(e.target.value)}if(e.target.id==="nom"&&e.key==="Enter"){e.preventDefault();const b=document.querySelector("[data-nom]");if(b&&!b.disabled)b.click()}});

function typeInto(el,t,ms){return new Promise(r=>{let i=0;const h=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(h);r()}},ms)})}
render(false);
(async()=>{const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 await typeInto($("#hi"),"Salut ma belle.",rm?1:75);
 await typeInto($("#hi2"),"Je suis ta styliste. Je vais trouver avec toi ce qui te va le mieux.",rm?1:28);
 $("#start").classList.add("show")})();
$("#start").addEventListener("click",()=>{unlock();$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),800);
 say("Salut ma belle"+(S.nom?" "+S.nom:"")+" ! Je suis ta styliste. "+P.home().say)});
</script>
</body>
</html>
