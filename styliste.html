<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Diva Divina — Espace styliste</title>
<link rel="icon" href="favicon.png?v=4">
<!-- Espace de la styliste (v143) : lire les demandes « Vérifié par une vraie styliste » et y répondre
     par écrit et/ou par message vocal. Accès protégé par le code de la styliste (vérifié par le Worker). -->
<style>
:root{--accent:#8C6D35;--goldg:linear-gradient(180deg,#A8843F,#8C6D35 55%,#765A2A);--ink:#292421;--muted:#6E6E6E;--line:#E6E6E6;--soft:#F5F5F5;--surface:#FFFFFF}
*{box-sizing:border-box}
html{background:#FBF7F0}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:url(fond-soie.webp) center/cover fixed #FBF7F0;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 120px}
h1{font:400 1.9rem/1.15 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:400 1.25rem Georgia,serif;margin:22px 0 10px}
.logo{display:block;text-align:center;font:700 1.6rem Georgia,serif;letter-spacing:.2em;color:var(--ink)}
.logo i{font-style:italic;letter-spacing:0;color:var(--accent);margin-inline-end:6px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(140,109,53,.12);margin:12px 0}
.btn{display:block;width:100%;padding:14px 18px;border:0;border-radius:999px;background:var(--goldg);color:#fff;font-weight:600;font-size:1rem;font-family:inherit;cursor:pointer;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.light{background:var(--soft);color:var(--accent);text-shadow:none;border:1px solid var(--line)}
.btn.red{background:#F7E6E2;color:#9A3B2B;text-shadow:none}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1 1 150px}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:140px}
.tabs{display:flex;gap:8px;margin:6px 0 12px}
.tabs button{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:8px}
.item b{font-size:1rem}.item small{color:var(--muted)}.item .st{grid-row:1/3;grid-column:2;align-self:center;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px}
.st.attente{background:#FFF3DC;color:#8C6D35}.st.repondu{background:#E6F2E1;color:#2F6B2A}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.meta span{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.q{white-space:pre-wrap;font-size:1.02rem}
.profil{white-space:pre-wrap;font-size:.88rem;color:#4a4440;background:var(--soft);border-radius:12px;padding:12px;max-height:260px;overflow:auto}
.photo{display:block;max-width:100%;max-height:420px;border-radius:12px;margin:8px auto 0}
.rec{display:flex;align-items:center;gap:12px;margin:12px 0}
.rec .dot{width:12px;height:12px;border-radius:50%;background:#C0392B;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
audio{width:100%;margin-top:8px}
.note{padding:12px 14px;border-radius:12px;background:#FFF3DC;color:#6b531f;margin:10px 0}
.ok{padding:12px 14px;border-radius:12px;background:#E6F2E1;color:#2F6B2A;margin:10px 0}
.back{border:0;background:none;color:var(--accent);font-weight:600;font-size:1rem;font-family:inherit;padding:0;cursor:pointer;margin:6px 0}
.vide{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
const API = "https://mon-style.imendriss271982.workers.dev/verif/admin";
const QUOI = { visage: "Visage", silhouette: "Silhouette", couleurs: "Couleurs", tenue: "Tenue", autre: "Autre question" };
const LANG = { fr: "Français", en: "Anglais", ar: "Arabe" };
const PAYS = { QA: "Qatar", SA: "Arabie saoudite", AE: "Émirats", KW: "Koweït", BH: "Bahreïn", OM: "Oman" };
const st = { code: "", list: null, filtre: "attente", cur: null, err: "", msg: "", busy: false, audio: "", rec: null, recT: 0 };
try { st.code = localStorage.getItem("ms_styliste") || ""; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const date = t => new Date(t).toLocaleString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });

async function api(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: st.code, ...body }) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j.erreur || "Le serveur ne répond pas."); e.code = j.code; throw e; }
  return j;
}
async function charger() {
  st.busy = true; st.err = ""; draw();
  try { st.list = (await api({ action: "list" })).demandes; }
  catch (e) { st.err = e.message; if (e.code === "code") { st.code = ""; try { localStorage.removeItem("ms_styliste"); } catch (er) {} } }
  st.busy = false; draw();
}
async function ouvrir(id) {
  st.busy = true; st.err = ""; st.msg = ""; st.audio = ""; draw();
  try { st.cur = await api({ action: "read", id }); } catch (e) { st.err = e.message; }
  st.busy = false; draw(); scrollTo(0, 0);
}
async function repondre() {
  const texte = ($("#rep") || {}).value || "";
  if (!texte.trim() && !st.audio) { st.err = "Écris ou enregistre ta réponse."; draw(); return; }
  st.busy = true; st.err = ""; draw();
  try { await api({ action: "reply", id: st.cur.id, texte: texte.trim(), audio: st.audio }); st.msg = "Réponse envoyée. La cliente la verra à sa prochaine ouverture de l’app."; st.cur = await api({ action: "read", id: st.cur.id }); st.audio = ""; charger(); }
  catch (e) { st.err = e.message; }
  st.busy = false; draw();
}
async function supprimer() {
  if (!confirm("Supprimer définitivement cette demande ?")) return;
  try { await api({ action: "delete", id: st.cur.id }); st.cur = null; charger(); } catch (e) { st.err = e.message; draw(); }
}
// Message vocal : 2 minutes maximum. iPhone enregistre en audio/mp4, Android/Chrome en audio/webm.
async function enregistrer() {
  if (st.rec) { st.rec.stop(); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    const r = new MediaRecorder(s, type ? { mimeType: type, audioBitsPerSecond: 48000 } : undefined), parts = [];
    r.ondataavailable = e => e.data.size && parts.push(e.data);
    r.onstop = () => { s.getTracks().forEach(t => t.stop()); clearTimeout(st.recT); st.rec = null; const b = new Blob(parts, { type: r.mimeType || type || "audio/mp4" }); const fr = new FileReader(); fr.onload = () => { st.audio = fr.result; draw(); }; fr.readAsDataURL(b); };
    r.start(); st.rec = r; st.recT = setTimeout(() => r.state === "recording" && r.stop(), 120000); draw();
  } catch (e) { st.err = "Le micro n’est pas autorisé. Autorise-le dans les réglages du navigateur."; draw(); }
}

function draw() {
  const m = $("#app"), err = st.err ? `<div class="note">${esc(st.err)}</div>` : "", logo = `<span class="logo"><i>Diva</i>DIVINA</span>`;
  const keepRep = ($("#rep") || {}).value;
  if (!st.code) {
    m.innerHTML = `${logo}<h1>Espace styliste</h1><p class="sub">Entre ton code secret de styliste.</p>${err}
     <div class="card"><input id="code" autocomplete="off" autocapitalize="characters" placeholder="DIVA-XXXX-XXXX-XXXX"><div style="height:12px"></div><button class="btn" id="go">Entrer</button></div>`;
    $("#go").onclick = () => { st.code = $("#code").value.trim().toUpperCase(); try { localStorage.setItem("ms_styliste", st.code); } catch (e) {} charger(); };
    return;
  }
  if (st.cur) {
    const d = st.cur;
    m.innerHTML = `${logo}<button class="back" id="bk">‹ Toutes les demandes</button>
     <h1>${esc(d.nom || "Cliente")}</h1>
     <div class="meta"><span>${esc(date(d.cree))}</span><span>Répondre en : ${esc(LANG[d.lang] || "Français")}</span>${d.pays ? `<span>${esc(PAYS[d.pays] || d.pays)}</span>` : ""}${(d.quoi || []).map(k => `<span>${esc(QUOI[k] || k)}</span>`).join("")}</div>
     <div class="card"><b>Sa question</b><p class="q">${esc(d.question || "(pas de question écrite : vérifier les éléments cochés)")}</p>${d.photo ? `<img class="photo" src="${d.photo}" alt="Photo de la cliente">` : ""}</div>
     <div class="card"><b>Ses résultats dans l’app</b><div class="profil">${esc(d.profil || "Pas encore d’analyse.")}</div></div>
     ${d.statut === "repondu" && d.rep ? `<div class="card"><b>Ta réponse envoyée</b><p class="q">${esc(d.rep.texte || "")}</p>${d.rep.audio ? `<audio controls src="${d.rep.audio}"></audio>` : ""}</div>` : ""}
     <h2>${d.statut === "repondu" ? "Modifier ma réponse" : "Ma réponse"}</h2>${err}${st.msg ? `<div class="ok">${esc(st.msg)}</div>` : ""}
     <textarea id="rep" placeholder="Écris ta réponse ici…">${esc(keepRep != null ? keepRep : "")}</textarea>
     <div class="rec">${st.rec ? `<span class="dot"></span><span>Enregistrement… touche « Arrêter » quand tu as fini (2 min max).</span>` : st.audio ? `<audio controls src="${st.audio}"></audio>` : ""}</div>
     <div class="row2"><button class="btn light" id="mic">${st.rec ? "Arrêter" : st.audio ? "Refaire le vocal" : "🎙️ Enregistrer un vocal"}</button>${st.audio && !st.rec ? `<button class="btn light" id="noaud">Retirer le vocal</button>` : ""}</div>
     <div style="height:12px"></div><button class="btn" id="send" ${st.busy || st.rec ? "disabled" : ""}>${st.busy ? "Envoi…" : "Envoyer ma réponse"}</button>
     <div style="height:24px"></div><button class="btn red" id="del">Supprimer la demande</button>`;
    $("#bk").onclick = () => { st.cur = null; st.msg = ""; st.err = ""; st.audio = ""; draw(); };
    $("#mic").onclick = enregistrer; if ($("#noaud")) $("#noaud").onclick = () => { st.audio = ""; draw(); };
    $("#send").onclick = repondre; $("#del").onclick = supprimer;
    return;
  }
  const l = st.list || [], f = l.filter(x => st.filtre === "tout" || x.statut === st.filtre), nAtt = l.filter(x => x.statut === "attente").length;
  m.innerHTML = `${logo}<h1>Espace styliste</h1><p class="sub">${st.list ? (nAtt ? `${nAtt} demande${nAtt > 1 ? "s" : ""} en attente` : "Aucune demande en attente") : "Chargement…"}</p>${err}
   <div class="tabs"><button data-f="attente" aria-pressed="${st.filtre === "attente"}">En attente (${nAtt})</button><button data-f="repondu" aria-pressed="${st.filtre === "repondu"}">Répondues</button><button data-f="tout" aria-pressed="${st.filtre === "tout"}">Toutes</button></div>
   ${f.length ? f.map(x => `<button class="item" data-id="${esc(x.id)}"><b>${esc(x.nom || "Cliente")}</b><small>${esc(date(x.cree))} · ${esc((x.quoi || []).map(k => QUOI[k] || k).join(", ") || "Question")}</small><span class="st ${x.statut}">${x.statut === "attente" ? "À répondre" : "Répondu"}</span></button>`).join("") : `<p class="vide">${st.busy ? "Chargement…" : "Rien ici pour l’instant."}</p>`}
   <div style="height:12px"></div><div class="row2"><button class="btn light" id="ref">Actualiser</button><button class="btn light" id="out">Se déconnecter</button></div>`;
  m.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { st.filtre = b.dataset.f; draw(); });
  m.querySelectorAll("[data-id]").forEach(b => b.onclick = () => ouvrir(b.dataset.id));
  $("#ref").onclick = charger;
  $("#out").onclick = () => { st.code = ""; st.list = null; try { localStorage.removeItem("ms_styliste"); } catch (e) {} draw(); };
}
draw(); if (st.code) charger();
</script>
</body>
</html>
