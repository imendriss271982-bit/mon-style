name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # v228 : tous les tests passent AVANT la publication. Un seul test en échec → l'app n'est pas publiée
  # (les téléphones gardent la version d'avant). Le détail de l'échec est dans l'onglet « Actions » de GitHub.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # v229 : 4 machines en même temps, chacune lance un quart des tests (≈ 3 min au lieu de 8).
    strategy:
      fail-fast: true
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright (navigateur de test)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps --only-shell chromium
      - name: Lancer tous les tests
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          NODE_PATH=/tmp/pw/node_modules JOBS=3 PART=${{ matrix.part }}/4 node tests/tout.mjs
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Numéro de version (mise à jour automatique de l'app)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA}/" index.html
          echo "${GITHUB_SHA}" > version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
