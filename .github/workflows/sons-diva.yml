name: Sons de secours de Diva (une fois)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sons-diva.yml']
permissions:
  contents: write
jobs:
  sons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les 2 phrases de Diva (ElevenLabs)
        run: |
          curl -fsSL -o sons/aura-enchantee.mp3 "https://elevenlabsusercontent.com/database/workspace/ee84b4cceb614e258faeb561efc47422/content_generation/30oERVfHYwCY8lsV3Xrj/72OZuozM9CWiA2NA7GGj/content.mp3?Expires=1794265200&KeyName=assets-cdn-key-1&Signature=zYMUKt6PvsDW7lfBDc7WsvDZJNk="
          curl -fsSL -o sons/aura-retour.mp3 "https://elevenlabsusercontent.com/database/workspace/ee84b4cceb614e258faeb561efc47422/content_generation/1aPPAy1dawE3r1UevSTp/SP8Wj4xnyx9dpbv8HyzB/content.mp3?Expires=1794265200&KeyName=assets-cdn-key-1&Signature=_k-W8ljo3zt-MikF9H0tBl22frM="
          ls -la sons
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sons/aura-enchantee.mp3 sons/aura-retour.mp3
          git commit -m "Sons de secours : voix de Diva (« c'est Diva »)"
          git push
